<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
  }

  #win-update-wrapper {
    width: 100%;
    min-height: 520px;
    background: #0078d4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.3s;
    padding: 40px 20px;
  }

  #win-update-wrapper.fullscreen-mode {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    z-index: 9999;
  }

  .win-logo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-bottom: 48px;
    opacity: 0.95;
  }

  .win-logo div {
    width: 28px;
    height: 28px;
    background: white;
  }

  .win-title {
    color: white;
    font-size: 22px;
    font-weight: 300;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: 0.3px;
  }

  .win-subtitle {
    color: rgba(255, 255, 255, 0.75);
    font-size: 13px;
    font-weight: 400;
    margin-bottom: 36px;
    text-align: center;
  }

  .progress-ring-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    margin-bottom: 28px;
  }

  .progress-ring-wrap svg {
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.2);
    stroke-width: 5;
  }

  .ring-fill {
    fill: none;
    stroke: white;
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease;
  }

  .ring-pct {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 22px;
    font-weight: 300;
  }

  .win-status {
    color: white;
    font-size: 13px;
    font-weight: 400;
    margin-bottom: 48px;
    text-align: center;
    min-height: 18px;
  }

  .win-warning {
    color: rgba(255, 255, 255, 0.7);
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.2px;
    line-height: 1.5;
  }

  .win-warning strong {
    color: white;
    font-weight: 500;
  }

  .spinner-dots {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    opacity: 0.2;
    animation: dotPulse 1.4s infinite;
  }

  .dot:nth-child(1) {
    animation-delay: 0s;
  }

  .dot:nth-child(2) {
    animation-delay: 0.2s;
  }

  .dot:nth-child(3) {
    animation-delay: 0.4s;
  }

  .dot:nth-child(4) {
    animation-delay: 0.6s;
  }

  .dot:nth-child(5) {
    animation-delay: 0.8s;
  }

  @keyframes dotPulse {

    0%,
    60%,
    100% {
      opacity: 0.2;
      transform: scale(1);
    }

    30% {
      opacity: 1;
      transform: scale(1.3);
    }
  }

  #fullscreen-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Segoe UI', sans-serif;
    transition: background 0.2s;
    z-index: 10;
  }

  #fullscreen-btn:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  #fullscreen-btn i {
    font-size: 14px;
  }

  #restart-btn {
    display: none;
    margin-top: 20px;
    background: white;
    color: #0078d4;
    border: none;
    padding: 10px 28px;
    border-radius: 4px;
    font-size: 14px;
    font-family: 'Segoe UI', sans-serif;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.2s;
  }

  #restart-btn:hover {
    opacity: 0.9;
  }

  .phase-label {
    color: rgba(255, 255, 255, 0.5);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

<div id="win-update-wrapper">
  <button id="fullscreen-btn" onclick="toggleFullscreen()">
    <i class="ti ti-arrows-maximize" id="fs-icon"></i>
    <span id="fs-label">Full screen</span>
  </button>

  <div class="win-logo">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>

  <div class="win-title" id="main-title">Working on updates</div>
  <div class="win-subtitle" id="main-subtitle">Don't turn off your PC. This will take a while.</div>

  <div class="phase-label" id="phase-label">Downloading</div>

  <div class="progress-ring-wrap">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="44" />
      <circle class="ring-fill" id="ring" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" />
    </svg>
    <div class="ring-pct" id="pct-label">0%</div>
  </div>

  <div class="spinner-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="win-status" id="status-text">Preparing to download updates…</div>

  <div class="win-warning">
    <strong>Keep your PC plugged in</strong> and connected to the internet.<br>
    Restarting will be required to complete installation.
  </div>

  <button id="restart-btn" onclick="resetUpdate()">Restart now</button>
</div>

<script>
  const phases = [
    {
      label: "Downloading",
      title: "Working on updates",
      subtitle: "Don't turn off your PC. This will take a while.",
      color: "#0078d4",
      steps: [
        [2, "Preparing to download updates…"],
        [8, "Checking for update compatibility…"],
        [15, "Downloading updates (1 of 3)…"],
        [22, "Downloading updates (2 of 3)…"],
        [30, "Downloading updates (3 of 3)…"],
      ]
    },
    {
      label: "Installing",
      title: "Installing updates",
      subtitle: "Your PC will restart several times. Sit back and relax.",
      color: "#005a9e",
      steps: [
        [38, "Preparing installation…"],
        [46, "Installing feature update (1 of 2)…"],
        [55, "Installing feature update (2 of 2)…"],
        [63, "Configuring system settings…"],
        [70, "Applying security patches…"],
      ]
    },
    {
      label: "Configuring",
      title: "Configuring update",
      subtitle: "Don't turn off your PC.",
      color: "#1a3a5c",
      steps: [
        [76, "Finalizing system configuration…"],
        [82, "Updating registry settings…"],
        [88, "Running compatibility checks…"],
        [93, "Completing feature update…"],
        [98, "Finalizing…"],
      ]
    },
    {
      label: "Complete",
      title: "You're up to date",
      subtitle: "Windows has been successfully updated.",
      color: "#107c10",
      steps: [
        [100, "Update complete. Preparing to restart…"]
      ]
    }
  ];

  const ring = document.getElementById('ring');
  const pctLabel = document.getElementById('pct-label');
  const statusText = document.getElementById('status-text');
  const mainTitle = document.getElementById('main-title');
  const mainSubtitle = document.getElementById('main-subtitle');
  const phaseLabel = document.getElementById('phase-label');
  const wrapper = document.getElementById('win-update-wrapper');
  const restartBtn = document.getElementById('restart-btn');
  const circumference = 276.46;

  let currentPct = 0;
  let stepIdx = 0;
  let phaseIdx = 0;
  let allSteps = [];

  phases.forEach(p => p.steps.forEach(s => allSteps.push({ ...p, pct: s[0], msg: s[1] })));

  function setRing(pct) {
    const offset = circumference - (pct / 100) * circumference;
    ring.style.strokeDashoffset = offset;
    pctLabel.textContent = pct + '%';
  }

  function animateTo(targetPct, callback) {
    const step = () => {
      if (currentPct < targetPct) {
        currentPct++;
        setRing(currentPct);
        setTimeout(step, 180);
      } else if (callback) callback();
    };
    step();
  }

  function runStep(idx) {
    if (idx >= allSteps.length) return;
    const s = allSteps[idx];
    statusText.textContent = s.msg;
    phaseLabel.textContent = s.label;
    mainTitle.textContent = s.title;
    mainSubtitle.textContent = s.subtitle;
    wrapper.style.background = s.color;

    animateTo(s.pct, () => {
      if (s.pct === 100) {
        setTimeout(() => {
          restartBtn.style.display = 'block';
          statusText.textContent = "Restart required to finish installing updates.";
        }, 800);
        return;
      }
      const delay = 800 + Math.random() * 700;
      setTimeout(() => runStep(idx + 1), delay);
    });
  }

  function resetUpdate() {
    currentPct = 0;
    stepIdx = 0;
    setRing(0);
    restartBtn.style.display = 'none';
    wrapper.style.background = '#0078d4';
    runStep(0);
  }

  function toggleFullscreen() {
    const el = document.getElementById('win-update-wrapper');
    const icon = document.getElementById('fs-icon');
    const lbl = document.getElementById('fs-label');
    if (!el.classList.contains('fullscreen-mode')) {
      el.classList.add('fullscreen-mode');
      icon.className = 'ti ti-arrows-minimize';
      lbl.textContent = 'Exit';
      if (el.requestFullscreen) el.requestFullscreen().catch(() => { });
    } else {
      el.classList.remove('fullscreen-mode');
      icon.className = 'ti ti-arrows-maximize';
      lbl.textContent = 'Full screen';
      if (document.exitFullscreen) document.exitFullscreen().catch(() => { });
    }
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      const el = document.getElementById('win-update-wrapper');
      el.classList.remove('fullscreen-mode');
      document.getElementById('fs-icon').className = 'ti ti-arrows-maximize';
      document.getElementById('fs-label').textContent = 'Full screen';
    }
  });

  setTimeout(() => runStep(0), 1228000);
</script>
